<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="ventry - solana dev, measurements">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="55%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#121a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14F195"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2535" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- slot lane: landing times by leader class -->
  <text x="60" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#3d4d68" letter-spacing="1.5">WHERE BOTS LAND ON A FRESH TOKEN, BY LEADER CLASS</text>
  <g opacity="0.45">
    <line x1="60" y1="276" x2="1140" y2="276" stroke="#2a3854" stroke-width="1"/>
    <g fill="#14F195">
      <circle cx="118" cy="276" r="4"/><circle cx="135" cy="276" r="4"/><circle cx="152" cy="276" r="4"/>
    </g>
    <g fill="#4a7fd4">
      <circle cx="268" cy="276" r="4"/><circle cx="291" cy="276" r="4"/>
    </g>
    <g fill="#9945FF">
      <circle cx="430" cy="276" r="4"/><circle cx="455" cy="276" r="4"/>
    </g>
    <g fill="#6b7a95">
      <circle cx="760" cy="276" r="4"/><circle cx="930" cy="276" r="4"/><circle cx="1090" cy="276" r="4"/>
    </g>
  </g>

  <text x="60" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="54" font-weight="700" fill="#e8edf5" letter-spacing="-1">ventry</text>
  <text x="300" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#14F195" filter="url(#glow)">solana dev</text>

  <text x="62" y="140" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#8b9bb4">i measure things instead of repeating them</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="60"  y="200" font-size="30" font-weight="700" fill="#14F195">211 GB</text>
    <text x="60"  y="224" font-size="13" fill="#6b7a95">on-chain data</text>

    <text x="258" y="200" font-size="30" font-weight="700" fill="#e8edf5">1,281</text>
    <text x="258" y="224" font-size="13" fill="#6b7a95">own trades logged</text>

    <text x="448" y="200" font-size="30" font-weight="700" fill="#e8edf5">1,148</text>
    <text x="448" y="224" font-size="13" fill="#6b7a95">tokens traced</text>

    <text x="638" y="200" font-size="30" font-weight="700" fill="#9945FF">631</text>
    <text x="638" y="224" font-size="13" fill="#6b7a95">videos, rules extracted</text>

    <text x="880" y="200" font-size="30" font-weight="700" fill="#ff5f56">8</text>
    <text x="880" y="224" font-size="13" fill="#6b7a95">of them were noise</text>
  </g>

  <text x="60" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#4a5a75">BAM 17-22 ms   ·   FD 16-24   ·   JitoLabs 25-28   ·   Harmonic 36-40   ·   terminal sniper 120-750</text>
</svg>
